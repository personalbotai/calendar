<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Libur Nasional Indonesia 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📅 Kalender Libur Nasional Indonesia 2026</h1>
            <p class="text-gray-600">Hari libur & cuti bersama berdasarkan SKB 3 Menteri</p>
        </header>

        <!-- Navigation -->
        <div class="flex justify-between items-center mb-6 bg-white rounded-lg shadow p-4">
            <button id="prevMonth" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                ← Sebelumnya
            </button>
            <h2 id="currentMonth" class="text-2xl font-bold text-gray-800"></h2>
            <button id="nextMonth" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                Selanjutnya →
            </button>
        </div>

        <!-- Calendar Grid -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Week headers -->
            <div class="grid grid-cols-7 bg-blue-600 text-white text-center font-bold py-3">
                <div>Sen</div>
                <div>Sel</div>
                <div>Rab</div>
                <div>Kam</div>
                <div>Jum</div>
                <div>Sab</div>
                <div>Min</div>
            </div>
            <!-- Calendar days -->
            <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
        </div>

        <!-- Legend -->
        <div class="mt-6 bg-white rounded-lg shadow p-4">
            <h3 class="font-bold text-gray-800 mb-3">Keterangan:</h3>
            <div class="flex flex-wrap gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-red-600 border-2 border-red-700 rounded"></div>
                    <span class="text-sm">Hari Libur Nasional</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-orange-500 border-2 border-orange-600 rounded"></div>
                    <span class="text-sm">Cuti Bersama</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 bg-red-50 border border-red-200 rounded"></div>
                    <span class="text-sm">Akhir Pekan</span>
                </div>
            </div>
        </div>

        <!-- Holiday List -->
        <div class="mt-6 bg-white rounded-lg shadow p-4">
            <h3 class="font-bold text-gray-800 mb-3">Daftar Hari Libur 2026:</h3>
            <div id="holidayList" class="grid md:grid-cols-2 gap-2 text-sm"></div>
        </div>

        <!-- Stats -->
        <div class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-3xl font-bold text-blue-600" id="totalHolidays">0</div>
                <div class="text-gray-600 text-sm">Total Libur Nasional</div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-3xl font-bold text-orange-600" id="totalShared">0</div>
                <div class="text-gray-600 text-sm">Total Cuti Bersama</div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-3xl font-bold text-green-600" id="totalWeekends">0</div>
                <div class="text-gray-600 text-sm">Akhir Pekan</div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-3xl font-bold text-purple-600" id="longestBreak">0</div>
                <div class="text-gray-600 text-sm">Libur Terpanjang (hari)</div>
            </div>
        </div>
    </div>

    <script>
        // Data hari libur 2026 dari API
        const holidays = [
            {date: '2026-01-01', name: 'Tahun Baru Masehi', type: 'national'},
            {date: '2026-01-16', name: 'Isra Mikraj Nabi Muhammad SAW', type: 'national'},
            {date: '2026-01-17', name: 'Hari Siwa Ratri', type: 'shared'},
            {date: '2026-02-17', name: 'Tahun Baru Imlek 2577 Kongzili', type: 'national'},
            {date: '2026-03-19', name: 'Hari Raya Nyepi', type: 'national'},
            {date: '2026-03-20', name: 'Hari Raya Idul Fitri 1447 Hijriyah', type: 'national'},
            {date: '2026-03-21', name: 'Hari Raya Idul Fitri 1447 Hijriyah', type: 'national'},
            {date: '2026-04-03', name: 'Wafat Isa Al Masih', type: 'national'},
            {date: '2026-04-04', name: 'Hari Saraswati', type: 'shared'},
            {date: '2026-05-01', name: 'Hari Buruh Internasional', type: 'national'},
            {date: '2026-05-14', name: 'Kenaikan Isa Al Masih', type: 'national'},
            {date: '2026-05-27', name: 'Hari Raya Idul Adha 1447 Hijriyah', type: 'national'},
            {date: '2026-05-31', name: 'Hari Raya Waisak 2570', type: 'national'},
            {date: '2026-06-01', name: 'Hari Lahirnya Pancasila', type: 'national'},
            {date: '2026-06-16', name: 'Tahun Baru Islam 1448 Hijriyah / Penampahan Galungan', type: 'national'},
            {date: '2026-06-17', name: 'Hari Raya Galungan', type: 'shared'},
            {date: '2026-06-18', name: 'Umanis Galungan', type: 'shared'},
            {date: '2026-06-27', name: 'Hari Raya Kuningan', type: 'shared'},
            {date: '2026-08-17', name: 'Hari Proklamasi Kemerdekaan RI', type: 'national'},
            {date: '2026-08-25', name: 'Maulid Nabi Muhammad SAW', type: 'national'},
            {date: '2026-10-31', name: 'Hari Saraswati', type: 'shared'},
            {date: '2026-12-25', name: 'Hari Raya Natal', type: 'national'}
        ];

        // Convert to map for easy lookup
        const holidayMap = {};
        holidays.forEach(h => {
            holidayMap[h.date] = h;
        });

        let currentDate = new Date(2026, 0); // January 2026

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month display
            const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                               'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;

            // Calculate first day of month and total days
            const firstDay = new Date(year, month, 1).getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Clear grid
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Adjust for Monday start: Sunday (0) becomes 7, Monday (1) becomes 1, etc.
            let startOffset = firstDay === 0 ? 7 : firstDay;

            // Add empty cells for days before first day (Monday start)
            for (let i = 1; i < startOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-24 bg-gray-50';
                grid.appendChild(emptyCell);
            }

            // Add days
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dateObj = new Date(year, month, day);
                const dayOfWeek = dateObj.getDay();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6; // Sunday or Saturday
                const holiday = holidayMap[dateStr];

                let cellClass = 'h-24 p-2 border border-gray-200 relative ';
                let dayNumberClass = 'day-number font-bold text-lg';
                
                if (holiday) {
                    if (holiday.type === 'national') {
                        cellClass += 'bg-red-600 text-white font-semibold border-2 border-red-700';
                        dayNumberClass += ' text-white';
                    } else {
                        cellClass += 'bg-orange-500 text-white font-semibold border-2 border-orange-600';
                        dayNumberClass += ' text-white';
                    }
                } else if (isWeekend) {
                    cellClass += 'bg-red-50 text-red-700 font-medium';
                    dayNumberClass += ' text-red-700';
                } else {
                    cellClass += 'bg-white text-gray-800';
                }

                const cell = document.createElement('div');
                cell.className = cellClass;

                const dayNum = document.createElement('div');
                dayNum.className = dayNumberClass;
                dayNum.textContent = day;
                cell.appendChild(dayNum);

                if (holiday) {
                    const holidayText = document.createElement('div');
                    holidayText.className = 'text-xs mt-1 leading-tight';
                    holidayText.textContent = holiday.name;
                    cell.appendChild(holidayText);
                }

                grid.appendChild(cell);
            }
        }

        function renderHolidayList() {
            const list = document.getElementById('holidayList');
            list.innerHTML = '';

            holidays.forEach(holiday => {
                const item = document.createElement('div');
                const date = new Date(holiday.date);
                const dayName = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][date.getDay()];
                const dateFormatted = `${date.getDate()} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][date.getMonth()]} ${date.getFullYear()}`;

                let colorClass = holiday.type === 'national' ? 'bg-red-50 border-red-200' : 'bg-orange-50 border-orange-200';

                item.className = `p-2 rounded border ${colorClass}`;
                item.innerHTML = `
                    <div class="font-semibold text-gray-800">${holiday.name}</div>
                    <div class="text-xs text-gray-600">${dateFormatted} (${dayName})</div>
                `;
                list.appendChild(item);
            });
        }

        function calculateStats() {
            let national = 0, shared = 0, weekends = 0;
            let longestStreak = 0, currentStreak = 0;
            let prevDate = null;

            // Count holidays and weekends for 2026
            for (let month = 0; month < 12; month++) {
                const daysInMonth = new Date(2026, month + 1, 0).getDate();
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `2026-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dateObj = new Date(2026, month, day);
                    const isWeekend = dateObj.getDay() === 0 || dateObj.getDay() === 6;
                    const holiday = holidayMap[dateStr];

                    if (holiday) {
                        if (holiday.type === 'national') national++;
                        else shared++;
                    }

                    if (isWeekend || holiday) {
                        currentStreak++;
                    } else {
                        if (currentStreak > longestStreak) {
                            longestStreak = currentStreak;
                        }
                        currentStreak = 0;
                    }
                }
            }

            // Count total weekends in 2026
            for (let day = 1; day <= 365; day++) {
                const date = new Date(2026, 0, day);
                if (date.getDay() === 0 || date.getDay() === 6) weekends++;
            }

            document.getElementById('totalHolidays').textContent = national;
            document.getElementById('totalShared').textContent = shared;
            document.getElementById('totalWeekends').textContent = weekends;
            document.getElementById('longestBreak').textContent = longestStreak;
        }

        // Event listeners
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        // Initial render
        renderCalendar();
        renderHolidayList();
        calculateStats();
    </script>
</body>
</html>
